<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Weighcast scores truck corridors by load, gusts, rain, and snow — then tells you when to hold the gate."
    />
    <meta name="theme-color" content="#e6eaf0" />
    <meta property="og:title" content="Weighcast" />
    <meta
      property="og:description"
      content="Load-aware weather ranking for truck dispatch. Weigh the corridor before you roll."
    />
    <meta property="og:image" content="/mark.svg" />
    <title>Weighcast</title>
    <script>
      try {
        var theme = localStorage.getItem('weighcast-theme')
        var next = theme === 'dark' ? 'dark' : 'light'
        document.documentElement.dataset.theme = next
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', next === 'dark' ? '#141210' : '#e6eaf0')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
