<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Weather-aware truck routing with risk-ranked alternatives." />
    <meta name="theme-color" content="#0b1220" />
    <title>Stormlane</title>
    <script>
      try {
        var theme = localStorage.getItem('stormlane-theme')
        document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'
        if (theme === 'light') {
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#eef2f7')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
