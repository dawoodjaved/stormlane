[project]
name = "weighcast-backend"
version = "0.0.0"
description = "Weather-ranked truck routing API"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["staticfiles"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "DJ", "ASYNC", "RUF", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["weighcast"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["^staticfiles/"]

[[tool.mypy.overrides]]
module = ["environ.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "weighcast.settings_test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "weighcast.settings_test"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
